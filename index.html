    } catch (error) {
      return initialValue;
    }

      try {

      return;
    }
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error("IndexedDB 초기화 시간이 초과되었습니다."));
    }, DB_TIMEOUT_MS);

      callback(value);

      if (!db.objectStoreNames.contains(storeName)) {

      }

      finish(resolve, event.target.result);
    };
    request.onerror = event => {
      finish(reject, event.target.error);
    };
  });

      const request = store.get(key);

        resolve(request.result !== undefined && request.result !== null ? request.result : defaultValue);
      };
      request.onerror = () => {
        clearTimeout(timer);
        resolve(defaultValue);
      };
    });
  } catch (e) {
    try {
      const item = window.localStorage.getItem(key);
      if (item) {

        return parsed !== null ? parsed : defaultValue;
      }

    } catch (err) {
      return defaultValue;
    }
  }

        reject(request.error);

    try {

  lines.push('2. Everything outside the marked region must stay exactly as in the TARGET: same subjects, identity, faces, hair, body, pose, clothing, objects, text, background, colors, lighting and texture.');
  lines.push('3. Do not crop, zoom, pan, rotate, flip, extend or re-compose. Return the FULL image with the same framing, perspective and aspect ratio as the TARGET — never only the region.');
  lines.push("4. Blend the edit seamlessly: match the surrounding lighting direction, shadows, reflections, perspective, scale, color grading, grain/noise, sharpness and the image's existing style and medium, so no seam, halo or patch is visible.");
  lines.push('5. If the instruction removes something, fill the region with plausible content that naturally continues the surrounding background.');
  if (mode === 'each' && total > 1) lines.push("6. This image is one item of a series; the same instruction is applied to each item's own marked region.");
  lines.push('- If lingerie, underwear or swimwear is involved, every person must be clearly adult and the styling must remain tasteful, non-explicit adult retail fashion. Follow the provider safety policy.');
  lines.push('', `USER INSTRUCTION (apply it only inside the marked region${refs.some(ref => ref.role !== 'series') ? "; image numbers refer to the user's #1..#N numbering" : ''}):`, instruction);
  return lines.join('\n');
};
// 마스크 편집 1건의 공급자별 요청 재료(실시간·Batch 공용).
// sourceUrl: 트레이 사본(모델에 보내는 이미지·마스크 좌표 기준) / baseUrl: 원본 전체 해상도(합성 바탕, 없으면 사본)
// refs: TARGET 외에 함께 보낼 이미지 [{ url, userIndex, role: 'reference' | 'series' }]
// 반환값의 settings 는 이 요청에 실제로 쓸 설정(해상도 자동 맞춤 반영)이다.
const buildMaskedEditRequest = async ({
  settings,
  userPrompt,
  sourceUrl,
  maskUrl,
  baseUrl = null,
  refs = [],
  userIndex = null,
  total = 1,
  mode = 'single',
  forBatch = false,
  signal
}) => {
  const provider = getModelProvider(settings.model);
  const prepared = await prepareMaskData(sourceUrl, maskUrl, settings.maskFeather, signal);
  if (prepared.empty) throw new Error('⚠️ 마스크가 비어 있습니다.\n편집할 영역이 칠해져 있지 않습니다.\n\n해결 방법\n- 첨부 이미지의 🖌 버튼을 눌러 바꿀 부분을 칠한 뒤 다시 보내세요.');
  const maxInputs = getModelMaxInputImages(settings.model);
  const modelName = getModelDisplayName(settings.model);
  if (1 + refs.length > maxInputs) {
    throw new Error(`⚠️ ${modelName}은(는) 한 요청에 이미지를 최대 ${maxInputs}장까지 받습니다.\n이번 마스크 편집은 대상 1장 + 참조 ${refs.length}장이 필요합니다.\n\n해결 방법\n- 참조(기준) 이미지 수를 줄이거나\n- 다중 참조를 지원하는 모델(나노바나나 2.1·프로, Grok Imagine 2.0, GPT Image 2.5)을 선택하세요.`);
  }
  // 합성 바탕 크기(원본 전체 해상도). 바탕을 읽지 못하면 트레이 사본으로 대신한다.
  let base = baseUrl;
  let baseWidth = prepared.width;
  let baseHeight = prepared.height;
  if (base) {
    try {
      const dims = await getImageDimensions(base, signal);
      baseWidth = dims.width;
      baseHeight = dims.height;
    } catch (error) {
      if (error?.name === 'AbortError') throw error;
      base = null;
    }
  }
  // 요청 해상도: 원본 크기에 자동 맞춤(설정에서 끄면 선택한 해상도). 결과는 어느 쪽이든 바탕(원본) 크기로 합성된다.
  const requestSettings = getMaskRequestSettings(settings, baseWidth, baseHeight);
  // 합성 설정(Batch 결과 도착 시에도 그대로 재현할 수 있도록 직렬화 가능한 값만 담는다).
  const maskCfg = {
    sourceUrl,
    baseUrl: base || null,
    maskUrl,
    feather: normalizeMaskFeather(settings.maskFeather),
    composite: settings.maskComposite !== false,
    colorMatch: settings.maskColorMatch !== false,
    autoAlign: settings.maskAutoAlign !== false
  };
  const sourceRatio = prepared.width / prepared.height;
  const refUrls = forBatch ? await Promise.all(refs.map(ref => shrinkForBatch(ref.url))) : refs.map(ref => ref.url);
  throwIfAborted(signal);
  const requestInfo = {
    provider,
    prepared,
    maskCfg,
    settings: requestSettings,
    baseWidth,
    baseHeight
  };
  if (provider === 'openai') {
    const inputs = await buildOpenaiMaskedInputs(prepared, forBatch ? BATCH_REFERENCE_MAX_DIM : OPENAI_EDIT_REFERENCE_MAX_DIM, signal);
    return {
      ...requestInfo,
      maskSourceMode: 'native-mask',
      prompt: buildMaskedEditPrompt({
        userPrompt,
        provider,
        region: prepared,
        nativeMask: true,
        refs: refs.map((ref, i) => ({
          ...ref,
          position: i + 1
        })),
        userIndex,
        total,
        mode
      }),
      images: [inputs.imagePng, ...refUrls],
      mask: inputs.maskPng,
      size: buildOpenaiSizeForRatio(sourceRatio, requestSettings.resolution)
    };
  }
  // Google·Grok: 영역 안내 이미지를 TARGET 바로 뒤에 보낸다. 모델의 입력 이미지 한도를 넘으면 생략하고 좌표 지시만 쓴다.
  const guideUrl = 2 + refs.length <= maxInputs ? await buildMaskGuideImage(prepared, signal, forBatch ? 1024 : MASK_GUIDE_MAX_DIM) : null;
  const targetUrl = provider === 'xai' ? await compressUploadedImage(sourceUrl, XAI_EDIT_REFERENCE_MAX_DIM, 'image/jpeg', XAI_EDIT_REFERENCE_QUALITY, {
    preserveIfWithinBounds: true
  }) : forBatch ? await shrinkForBatch(sourceUrl) : sourceUrl;
  throwIfAborted(signal);
  const refOffset = guideUrl ? 2 : 1;
  const nearestGoogle = nearestAspectRatio(sourceRatio, GOOGLE_ASPECT_RATIOS);
  const nearestGoogleValue = ratioStringToValue(nearestGoogle);
  const inferredCanonical = inferAspectRatioFromDimensions(prepared.width, prepared.height, 0.02);
  return {
    ...requestInfo,
    maskSourceMode: guideUrl ? 'guide-image' : 'coordinates',
    prompt: buildMaskedEditPrompt({
      userPrompt,
      provider,
      region: prepared,
      guidePosition: guideUrl ? 1 : null,
      refs: refs.map((ref, i) => ({
        ...ref,
        position: refOffset + i
      })),
      userIndex,
      total,
      mode,
      singleImage: !guideUrl && refs.length === 0
    }),
    images: [targetUrl, ...(guideUrl ? [guideUrl] : []), ...refUrls],
    labels: [`input image 1 — TARGET${userIndex ? ` (user image #${userIndex})` : ''}: edit only the marked region and return this image`, ...(guideUrl ? ['input image 2 — REGION GUIDE ONLY (locate the region; never reproduce the magenta tint, outline or darkening)'] : []), ...refs.map((ref, i) => `input image ${refOffset + i + 1} — ${ref.role === 'series' ? 'SERIES STYLE MATCH' : `REFERENCE (user image #${ref.userIndex})`}`)],
    // Google: 원본 비율이 지원 비율과 2% 이내면 그 비율을 지정, 아니면 생략해 입력 크기를 따르게 한다(공식 기본 동작).
    googleAspectRatio: nearestGoogleValue && Math.abs(sourceRatio - nearestGoogleValue) / nearestGoogleValue <= 0.02 ? nearestGoogle : 'auto',
    // xAI: 앱이 쓰는 표준 비율과 2% 이내일 때만 지정한다(그 외에는 생략).
    xaiAspectRatio: inferredCanonical
  };
};
// 마스크 편집 실시간 실행(공급자 공통). 결과는 각 공급자 결과 빌더에서 원본(전체 해상도 바탕)과 합성된다.
const requestMaskedEditResults = async ({
  settings: requestedSettings,
  userPrompt,
  sourceUrl,
  maskUrl,
  baseUrl = null,
  refs = [],
  userIndex = null,
  total = 1,
  mode = 'single',
  n = 1,
  seed,
  signal,
  extra = {}
}) => {
  const request = await buildMaskedEditRequest({
    settings: requestedSettings,
    userPrompt,
    sourceUrl,
    maskUrl,
    baseUrl,
    refs,
    userIndex,
    total,
    mode,
    signal
  });
  throwIfAborted(signal);
  // 이 요청에 실제로 쓰는 설정(해상도 자동 맞춤 반영). 아래 모든 요청·결과 처리는 이 값을 쓴다.
  const settings = request.settings;
  const maskComposite = {
    ...request.maskCfg,
    prepared: request.prepared
  };
  const maskExtra = {
    ...extra,
    resolution: settings.resolution,
    maskSourceMode: request.maskSourceMode,
    maskResolutionAuto: requestedSettings.maskMatchResolution !== false && requestedSettings.maskComposite !== false
  };
  if (request.provider === 'google') {
    const parts = [{
      text: request.prompt
    }];
    request.images.forEach((url, i) => {
      const inline = dataUrlToInlineData(url);
      if (!inline) return;
      parts.push({
        text: `[${request.labels[i]}]`
      }, inline);
    });
    const contents = [{
      role: 'user',
      parts
    }];
    const thinkingLevel = resolveGoogleThinkingLevel(settings.model, userPrompt, settings, {
      treatAsComplex: true
    });
    const seeds = Array.from({
      length: n
    }, (_, i) => deriveVariationSeed(seed, i));
    const settled = await runWithConcurrency(seeds, PROVIDER_CONCURRENCY.google, async requestSeed => {
      const {
        data,
        requestedTier
      } = await executeGoogleGenerateContent({
        modelId: getModelId(settings.model),
        settings,
        contents,
        seed: requestSeed,
        thinkingLevel,
        aspectRatio: request.googleAspectRatio,
        signal
      });
      const built = await buildGoogleResults({
        data,
        modelKey: settings.model,
        requestedTier,
        resolution: getApiRequestResolution(settings),
        settings,
        signal,
        onlyLast: true,
        maskComposite,
        extra: {
          ...maskExtra,
          visualSeed: requestSeed
        }
      });
      if (built.length === 0) {
        const detail = describeGoogleBlock(data);
        throw new Error(detail ? `이미지가 생성되지 않았습니다 — ${detail}` : '이미지가 생성되지 않았습니다.');
      }
      return built;
    }, signal);
    const results = settled.filter(entry => entry.ok).flatMap(entry => entry.value);
    const failure = settled.find(entry => !entry.ok);
    if (results.length === 0 && failure) throw failure.error;
    return {
      results,
      error: failure ? failure.error?.message || '' : ''
    };
  }
  if (request.provider === 'xai') {
    const result = await executeXaiImageRequest({
      settings,
      prompt: request.prompt,
      images: request.images,
      aspectRatio: request.xaiAspectRatio,
      n,
      signal
    });
    const results = await buildXaiResults({
      data: result.data,
      settings,
      resolution: settings.resolution,
      signal,
      expected: n,
      maskComposite,
      extra: {
        ...maskExtra,
        visualSeed: seed
      }
    });
    if (results.length === 0) throw new Error('Grok 이미지 응답이 비어 있습니다.');
    return {
      results,
      error: results.length < n ? `요청한 ${n}장 중 ${results.length}장만 반환되었습니다.` : ''
    };
  }
  const quality = getOpenaiQuality(settings);
  const result = await executeOpenaiImageRequest({
    settings,
    prompt: request.prompt,
    images: request.images,
    mask: request.mask,
    size: request.size,
    quality,
    n,
    signal
  });
  const results = await buildOpenaiResults({
    data: result.data,
    settings,
    quality,
    usedSize: result.usedSize,
    resolution: settings.resolution,
    signal,
    expected: n,
    maskComposite,
    extra: {
      ...maskExtra,
      // 공식 mask 가 거부돼 마스크 없이 처리된 경우(좌표 지시 + 앱 합성으로 영역 밖 보존)를 정직하게 기록한다.
      maskSourceMode: result.maskDropped ? 'coordinates' : 'native-mask',
      visualSeed: seed
    }
  });
  if (results.length === 0) throw new Error('OpenAI 이미지 응답이 비어 있습니다.');
  return {
    results,
    error: results.length < n ? `요청한 ${n}장 중 ${results.length}장만 반환되었습니다.` : ''
  };
};
// 단일 첨부 + 마스크 편집(모든 공급자 공통 경로). baseUrl = 원본 전체 해상도(합성 바탕, 없으면 첨부 사본).
const generateMaskedSingleEdit = async (prompt, chatHistoryMessages, sourceUrl, maskUrl, baseUrl, settings, signal, options = {}) => {
  throwIfAborted(signal);
  const provider = getModelProvider(settings.model);
  if (provider === 'xai' && !getXaiApiKey(settings)) throw new Error("XAI_API_KEY_MISSING");
  if (provider === 'openai' && !getOpenaiApiKey(settings)) throw new Error("OPENAI_API_KEY_MISSING");
  const countNum = options.forceCount || getEffectiveCount(settings);
  const latestUser = getLatestUserMessage(chatHistoryMessages);
  const visualSeed = normalizeVisualSeed(latestUser?.visualSeed) || getLatestVisualSeed(chatHistoryMessages) || createVisualSeed();
  const context = buildContinuityContext(prompt, chatHistoryMessages, settings, {
    source: 'current-user-upload'
  }, GOOGLE_CONTEXT_MAX_CHARS);
  const memory = buildStoredMemory({
    prompt,
    basePrompt: context.basePrompt,
    editHistory: '',

  });

// ─── 단일/무첨부 생성·편집(대화 연속성 포함) ─────────────────────────────────────────────────────
// 대화 메모리(원본 사양·편집 이력·시드) 계산. 현재 업로드 이미지를 편집할 때 절약 모드면 이전 대화 메모리를 생략한다
// (업로드 이미지 자체가 기준이므로 다른 이미지의 설명을 함께 보내면 토큰 낭비이자 혼선 요인).
const buildContinuityContext = (prompt, chatHistoryMessages, settings, reference, maxChars) => {
  const isCurrentUpload = reference?.source === 'current-user-upload';
  const skipHistory = isCurrentUpload && settings.saveMode;
  const previousTurnSummary = skipHistory ? '' : compactPromptText(buildPreviousTurnSummary(chatHistoryMessages, settings.saveMode), maxChars);
  const visualMemorySummary = skipHistory ? '' : compactPromptText(buildVisualMemorySummary(chatHistoryMessages, settings.saveMode), maxChars);
  const basePrompt = isCurrentUpload ? skipHistory ? '' : visualMemorySummary : reference?.basePromptMemory || reference?.promptMemory || visualMemorySummary;
  return {
    previousTurnSummary,
    visualMemorySummary,
    basePrompt,
    editHistory: isCurrentUpload ? '' : reference?.editHistory || '',
    lockProfile: isCurrentUpload ? '' : reference?.lockProfile || ''
  };
};
// 결과 메시지에 저장할 연속성 메모리(사용자 원문 기반, 래핑 프롬프트 미포함).
const buildStoredMemory = ({
  prompt,
  basePrompt,
  editHistory,
  isFresh,
  visualSeed
}) => {
  const storedBasePromptMemory = buildBasePromptMemory(prompt, isFresh ? '' : basePrompt, visualSeed);
  const storedEditHistory = buildEditHistoryMemory(editHistory, prompt, isFresh || !basePrompt);
  const storedPromptMemory = compactPromptText([storedBasePromptMemory, storedEditHistory ? `Edits applied:\n${storedEditHistory}` : ''].filter(Boolean).join('\n'), GOOGLE_MEMORY_MAX_CHARS);
  return {
    promptMemory: storedPromptMemory,
    basePromptMemory: storedBasePromptMemory,
    editHistory: storedEditHistory,
    lockProfile: compactPromptText(buildContinuityLockProfile('', visualSeed), GOOGLE_LOCK_MAX_CHARS)
  };
};
const generateXaiImages = async (prompt, chatHistoryMessages, settings, signal, options = {}) => {

  if (!getXaiApiKey(settings)) throw new Error("XAI_API_KEY_MISSING");
  const rawReferenceSource = getXaiReferenceSource(chatHistoryMessages, settings);
  const referenceSource = compactXaiReferenceSource(rawReferenceSource);

    preserveIfWithinBounds: true
  }) : null;

  const continuityMode = referenceImage ? 'direct' : context.basePrompt ? 'memory' : 'fresh';
  // 참조 이미지 비율이 목표 비율과 다르면 Google 경로와 같은 재구성 지시문을 덧붙인다(흐린 레터박스 없이 모델이 직접 재구성).
  const aspectChanged = referenceImage ? await referenceAspectDiffersFromTarget(referenceImage, settings.aspectRatio, signal) : false;

  const lockedUserPrompt = buildHardConsistencyPrompt(promptForModel, context.basePrompt, context.lockProfile, visualSeed, Boolean(referenceImage), continuityMode, context.editHistory);
  const finalPrompt = limitXaiPrompt(buildCleanImagePrompt(lockedUserPrompt, settings, Boolean(referenceImage), context.previousTurnSummary, context.visualMemorySummary, visualSeed, continuityMode), prompt);
  let result;

      signal

  }

    prompt,
    basePrompt: context.basePrompt,

  const images = await buildXaiResults({
    data: result.data,

      runId,

        ...prev

  const handleUpscale = async (msg, targetResolution, options = {}) => {
